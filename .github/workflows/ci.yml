name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: govulncheck (known vulnerabilities in Go and the standard library)
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: completion scripts (bash, fish)
        if: runner.os == 'Linux'
        run: |
          bash -n completions/CommitGen.bash
          sudo apt-get update -qq && sudo apt-get install -y -qq fish >/dev/null
          fish --no-execute completions/CommitGen.fish
      - name: completion script (zsh)
        if: runner.os == 'macOS'
        run: zsh -n completions/_CommitGen
      - name: completion script (powershell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/completions/CommitGen.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs; exit 1 }

  action:
    # Runs this repository's own GitHub Action, the way users would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: notes
        uses: ./
        with:
          command: changelog
      - run: test -n "${{ steps.notes.outputs.text }}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t commitgen .
      - run: docker run --rm commitgen version
